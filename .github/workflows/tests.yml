name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python 3.9 tool cache provides an Ubuntu 24.04 build.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap locales
          sudo locale-gen en_US.UTF-8
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install "pytest==8.4.2"
      - run: python -m pytest -q
      - name: Verify the installed CLI outside the checkout
        run: |
          python -m pip install --no-deps .
          cd "$RUNNER_TEMP"
          agy-bridge --version
          python -I -m agy_bridge --version
          HOME="$RUNNER_TEMP/agy-bridge-smoke-home" agy-bridge ps --json
