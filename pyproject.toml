[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-bridge"
version = "0.3.0"
description = "Delegate read-only tasks and isolated coding jobs to the Antigravity CLI from Claude Code."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agy-bridge = "agy_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/dominno/claude-agy-bridge"
Issues = "https://github.com/dominno/claude-agy-bridge/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
